[platformio]
default_envs = nanoatmega328
src_dir = .

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 19200
lib_deps =
  Servo
  MPU6050_tockn
  ezLED
  OneButton
build_flags = -I.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 19200
lib_deps =
  ESP32Servo
  MPU6050_tockn
  ezLED
  OneButton
build_flags = -I.

# ==========================================
# ARDUINO CLOUD AUTOMATED MATRIX BUILD
# Targets: Arduino Nano (New & Old Bootloader)
# Dependencies: MPU6050_tockn, ezLED, OneButton, Servo, ESP32Servo
# ==========================================

name: Build and Save Arduino Nano Binaries

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        board:
          # Target 1: New / Official Nano Bootloader
          - fqbn: "arduino:avr:nano"
            platform: "arduino:avr"
            artifact_name: "nano-new-bootloader"
          
          # Target 2: Old Nano Bootloader / Common Clones
          - fqbn: "arduino:avr:nano:cpu=atmega328old"
            platform: "arduino:avr"
            artifact_name: "nano-old-bootloader"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Build Output Directory
        run: mkdir -p build-output

      # Compile and automatically dump the compiled binaries to a local folder
      - name: Compile Arduino Sketch
        uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.board.fqbn }}
          platforms: |
            - name: ${{ matrix.board.platform }}
          
          # External libraries used by the firmware. AVR builds use Servo;
          # ESP32 builds use ESP32Servo.
          libraries: |
            - name: MPU6050_tockn
            - name: ezLED
            - name: OneButton
            - name: Servo
            - name: ESP32Servo
            
          sketch-paths: |
            - ./cheesehead_timer
            
          # This tells the compiler where to place the final binary outputs
          cli-compile-flags: |
            - --output-dir
            - ./build-output

      # Upload the unique binary from this matrix run as a separate GitHub Artifact
      - name: Save Compiled Binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.board.artifact_name }}-binary
          path: ./build-output/*.hex
          if-no-files-found: error
